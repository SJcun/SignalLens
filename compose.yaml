services:
  api:
    build: ./apps/api
    # 容器间需要通过 Compose 网络访问 API；宿主机仍不映射该端口。
    command: uvicorn signallens.main:app --host 0.0.0.0 --port 8000
    environment:
      SIGNALLENS_DATABASE_URL: sqlite:////data/signallens.db
      SIGNALLENS_WEB_ORIGIN: https://lens.example.com
      SIGNALLENS_BOOTSTRAP_PASSWORD_FILE: /data/initial-admin-password.txt
      SIGNALLENS_SESSION_DAYS: ${SIGNALLENS_SESSION_DAYS:-30}
      SIGNALLENS_LLM_BASE_URL: ${SIGNALLENS_LLM_BASE_URL:-https://api.openai.com/v1}
      SIGNALLENS_LLM_API_KEY: ${SIGNALLENS_LLM_API_KEY:-}
      SIGNALLENS_LLM_MODEL: ${SIGNALLENS_LLM_MODEL:-}
      SIGNALLENS_LLM_RESPONSE_FORMAT: ${SIGNALLENS_LLM_RESPONSE_FORMAT:-auto}
      SIGNALLENS_LLM_MAX_TOKENS: ${SIGNALLENS_LLM_MAX_TOKENS:-16384}
    volumes:
      - signallens-data:/data
    restart: unless-stopped

  worker:
    build: ./apps/api
    command: signallens-worker
    environment:
      SIGNALLENS_DATABASE_URL: sqlite:////data/signallens.db
      SIGNALLENS_LLM_BASE_URL: ${SIGNALLENS_LLM_BASE_URL:-https://api.openai.com/v1}
      SIGNALLENS_LLM_API_KEY: ${SIGNALLENS_LLM_API_KEY:-}
      SIGNALLENS_LLM_MODEL: ${SIGNALLENS_LLM_MODEL:-}
      SIGNALLENS_LLM_RESPONSE_FORMAT: ${SIGNALLENS_LLM_RESPONSE_FORMAT:-auto}
      SIGNALLENS_LLM_MAX_TOKENS: ${SIGNALLENS_LLM_MAX_TOKENS:-16384}
    volumes:
      - signallens-data:/data
    restart: unless-stopped

  web:
    build: ./apps/web
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  signallens-data:
