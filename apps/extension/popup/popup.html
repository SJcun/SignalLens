<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="topbar">
      <div><strong>SignalLens</strong><span>网页内容分诊</span></div>
      <div class="topbar-actions">
        <span id="key-summary" class="hidden"></span>
        <button id="change-key" class="text-button hidden" type="button">更换 Key</button>
        <button id="reconvert" class="icon-button hidden" title="重新提取" aria-label="重新提取">↻</button>
      </div>
    </header>

    <section id="key-panel" class="key-panel hidden">
      <strong>配置插件 Key</strong>
      <span>在 Web 的“账户安全”页生成 Key，然后粘贴到这里。</span>
      <form id="key-form">
        <label>插件 Key<input id="plugin-key" type="password" autocomplete="off" placeholder="sk-sl-..." required /></label>
        <p id="key-error" class="key-error hidden"></p>
        <button id="key-submit" class="primary wide" type="submit">保存 Key</button>
      </form>
    </section>

    <div id="plugin-content" class="hidden">
      <div id="status" class="status" role="status" aria-live="polite">正在提取当前网页…</div>

      <section id="meta" class="meta hidden">
        <strong id="meta-title"></strong>
        <span id="meta-count"></span>
        <span id="quality" class="quality"></span>
      </section>

      <pre id="preview" class="preview hidden" tabindex="0"></pre>

      <section id="analysis-result" class="analysis-result hidden">
        <strong>已进入分析队列</strong>
        <span>正文已可靠保存，将按 SignalLens 整理设置执行。</span>
        <a id="analysis-detail" target="_blank">打开 SignalLens</a>
      </section>

      <footer id="actions" class="actions hidden">
        <button id="analyze" class="primary wide">✨ 提交 AI 分析</button>
        <div class="grid">
          <button id="selection">选中内容</button>
          <button id="manual">选择区域</button>
          <button id="fullpage">整页内容</button>
        </div>
        <div class="grid">
          <button id="download">下载 Markdown</button>
          <button id="copy">复制 Markdown</button>
          <button id="download-json">下载 JSON</button>
          <button id="open-preview">渲染预览</button>
        </div>
      </footer>
    </div>
    <script src="../dist/popup.js"></script>
  </body>
</html>
