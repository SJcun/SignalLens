<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="topbar">
      <div><strong>SignalLens</strong><span>网页内容分诊</span></div>
      <button id="reconvert" class="icon-button" title="重新提取" aria-label="重新提取">↻</button>
    </header>

    <div id="status" class="status" role="status" aria-live="polite">正在提取当前网页…</div>

    <section id="meta" class="meta hidden">
      <strong id="meta-title"></strong>
      <span id="meta-count"></span>
      <span id="quality" class="quality"></span>
    </section>

    <pre id="preview" class="preview hidden" tabindex="0"></pre>

    <section id="analysis-result" class="analysis-result hidden">
      <strong>已进入分析队列</strong>
      <span>正文已可靠保存，可以关闭插件。</span>
      <a id="analysis-detail" target="_blank">打开 SignalLens</a>
    </section>

    <footer id="actions" class="actions hidden">
      <button id="analyze" class="primary wide">✨ 提交 AI 分析</button>
      <div class="grid">
        <button id="selection">选中内容</button>
        <button id="manual">选择区域</button>
        <button id="fullpage">整页内容</button>
      </div>
      <div class="grid">
        <button id="download">下载 Markdown</button>
        <button id="copy">复制 Markdown</button>
        <button id="download-json">下载 JSON</button>
        <button id="open-preview">渲染预览</button>
      </div>
    </footer>
    <script src="../dist/popup.js"></script>
  </body>
</html>
